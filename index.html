changelog:[
{v:17,desc:"Navegação reorganizada por domínio: novo grupo Clientes (Clientes Totais + Contactos), novo grupo Estratégia & Planeamento (Estratégia + ARR + Orçamento 2027 + Histórico), Mapa integrado em Comercial, Atividades promovido a item de topo. Sem alteração de funcionalidade."},
{v:2,desc:"Correção de valores ARR/MRR errados (Grupo Sanitas, Almeria AT/Mudança, IMED Pneumo, Integração PAC, Meritxell Pneumo, Almeria AT2026); Arnau Vilanova e Hospitales Pascuales reclassificados de Proposta para Lead; despesas substituídas pela lista granular real (38 transações, €14.495,22)."},
{v:3,desc:"Rambla Nova (2.600€) reclassificado de venda 2025 para deal 2026 em estado Adjudicado (sem factura); removida factura indevida do Filestream VOT; valores MRR convertidos para ARR (×12) em todos os deals."},
{v:4,desc:"Removidos clientes Clínicas Cadiz e Contacto Digestivo (sem valor associado); Torrecárdenas e Inmaculada renomeados com prefixo \"Almeria - \"; despesas agrupadas por categoria (IMED, Lleida, Congresso SPED Sevilha, Almeria)."},
{v:5,desc:"Removidas 11 oportunidades de pipeline correspondentes a linhas a vermelho no ficheiro Espanha 2026 (excluídas do CRM mas clientes mantidos); removido deal duplicado da Rambla Nova (2.600€); adicionadas especialidades desses clientes ao registo Clientes Totais, todas com AT inactiva."},
{v:6,desc:"As 3 propostas de Almeria (El Toyo 1.500€, Inmaculada 3.000€, Torrecárdenas 7.500€) reclassificadas de Proposta/Projeto para Ganho (Adjudicado) e descritas como v6 em vez de migração; Policlínica Salud 4 corrigida para especialidade Gastro."},
{v:7,desc:"Removido card duplicado \"Almeria AT 2026\" (12.000€) — valor já coberto pela soma das 3 adjudicações v6 de Almeria (1.500+3.000+7.500=12.000€)."},
{v:8,desc:"Adicionada proposta MWP180/2026 IMED Gastro+Pneumo (47.432€, ARR 32.832€) do CRM, com registo em Atividades. Introduzido registo automático de atividades para todas as ações da app (deals, faturas, cobranças, clientes, importações)."},
{v:9,desc:"Novo estado \"Perdido\" com razão de perda obrigatória e registo em Atividades; novas tabs Ganhas e Perdidas no grupo Comercial, ambas com possibilidade de reabrir a proposta. Propostas perdidas deixam de contar no pipeline aberto."},
{v:28,desc:"Adicionada uma capa de entrada com o logo Mobilwave Espanha e um botão Entrar, mostrada ao abrir a app antes do painel principal."},
{v:27,desc:"Novo estado \"Concluído\" para projetos ganhos e já entregues (a receita mantém-se, como Ganho) com aba própria Concluídas. Possibilidade de anexar ficheiros (PDF, Word, Excel, imagem) aos deals: propostas na fase de Pipeline e relatórios nos concluídos. Salvaguardas de armazenamento: limite de 1,5 MB por ficheiro, medidor de espaço com aviso aos 80%, gravação protegida contra falha por falta de espaço, e limpeza automática de anexos ao apagar deals. Nota: os anexos são guardados no navegador (base64) e incluídos nos backups — usa com moderação para não esgotar o espaço."},
{v:26,desc:"A aplicação foi renomeada de \"Projeto Espanha\" para \"Mobilwave Espanha\" em todo o lado (título, cabeçalho, rodapé, relatório, nome de instalação). Base de dados actualizada com o backup de 13/08/2026 (29 clientes, 27 deals, 32 contactos, 82 atividades), já sem a factura duplicada da Rambla Nova."},
{v:25,desc:"Base de dados actualizada com o backup de 13/08/2026 (29 clientes incl. QuironSalud Madrid e ST Endoscopia, 27 deals, 70 atividades). Removida uma factura duplicada da Rambla Nova (2.320€ contados em dobro por ter sido lançada tanto na app como manualmente), repondo o facturado correcto de 8.703,57€. Valores mantêm-se alinhados ao cêntimo com o P&L e o Espanha 2026."},
{v:24,desc:"Lançada a factura da Rambla Nova (2.320€, 03/08/2026, pendente de cobrança) que existia no Excel mas ainda não tinha sido registada na app. Com este lançamento, os cinco indicadores financeiros (facturação, custos, recebido, adjudicado por facturar e pendente de cobrança) passam a coincidir exactamente com o P&L e o mapa Espanha 2026."},
{v:23,desc:"Substituídas todas as 25 caixas de diálogo nativas do browser (alert/confirm/prompt) por modais próprios, no estilo visual da app: avisos (toast), confirmações com botões Cancelar/Confirmar, e pedidos de texto (razão da perda, ARR) com campo próprio. As confirmações de eliminação passaram a explicar melhor o que será removido."},
{v:22,desc:"Auditoria profunda: (1) corrigido o cálculo de \"cobrado\" — passou a contar o dinheiro efectivamente recebido no ano (base de caixa, por data de cobrança) em vez das faturas do ano cobradas; antes, faturas de 2025 pagas em 2026 (9.511€) desapareciam do indicador e o cashflow aparecia negativo quando na realidade é positivo. (2) O rácio de cobrança passou a medir recebido sobre cobrável (recebido+pendente), evitando percentagens acima de 100%. (3) Escape de HTML em nomes, funções e notas (protecção contra injecção). (4) Uso consistente de beforeYear() em vez de comparações de data cruas. Integridade, migração v1->v22, robustez (app vazia, orçamento zero, valores negativos, datas inválidas) e coerência cruzada de totais — todos verificados."},
{v:21,desc:"Corrigida a pesquisa de contactos que perdia o foco a cada tecla (obrigava a escrever letra a letra): agora o filtro actualiza apenas a lista de resultados, sem redesenhar a página. Adicionado filtro por nome de cliente nos Clientes Totais, com o mesmo comportamento. Base de dados actualizada com o backup de 03/08/2026."},
{v:20,desc:"Base de dados actualizada com o backup de 03/08/2026 (28 clientes, 26 deals, 26 contactos, 58 atividades, próximas acções e moradas preenchidas). KPI Directo vs Canal reformulado para mostrar ambos os lados (% via canal + valores directo/canal), evitando o \"0,0%\" que parecia avaria. Adicionado seletor de ano no Dashboard e Financeiro (aparece só quando há mais de um ano nos dados), com isolamento correcto por ano (limite inferior e superior) — permite consultar 2025, 2026, etc. separadamente."},
{v:19,desc:"Auditoria: o ano de análise deixou de estar fixo em 2026 e passou a ser dinâmico (o ano mais recente presente nos dados), incluindo nos títulos visíveis — a app deixa de precisar de alterações manuais na viragem do ano. Restantes verificações (integridade, migração v1->v19, robustez com dados vazios, coerência cruzada de totais, código morto) sem problemas."},
{v:18,desc:"Ficha de cliente passou a permitir editar o nome, região e canal (além da morada e contactos); renomeações ficam registadas em Atividades. Novo botão Relatório no cabeçalho que gera um resumo de gestão (financeiro, comercial, ARR, previsão, oportunidades em aberto e cobranças em risco) pronto a imprimir ou guardar em PDF pelo browser."},
{v:17,desc:"Backup automático configurável (descarrega uma cópia quando abres a app e já passaram os dias definidos desde o último; ajustável nas Definições, 0 desactiva); edição rápida da próxima acção directamente no cartão do Pipeline (um clique, sem abrir o formulário todo), incluindo criar quando ainda não existe."},
{v:16,desc:"Ficha de cliente clicável com morada, telefone e contactos; novo separador Contactos (nome, função, telefone, email, notas) com procura e ligação directa para telefonar ou enviar email. O controlo de acesso por palavra-passe foi retirado a pedido."},
{v:15,desc:"Integrada a base de dados corrigida de 23/07/2026: registados os 4 negócios de 2025 que sustentam a dívida anterior (Meritxell e IMED), preenchido o ARR de 7 vendas (total 19.160€/ano), Grupo Sanitas marcado como perdido com razão registada, Rambla Nova passou a ganho, e adicionado o Hospital Virgem do Rocio como lead."},
{v:14,desc:"App preparada para instalação (PWA): manifest, ícones, service worker com funcionamento offline, botão Instalar App e suporte a ecrãs com notch. Requer alojamento em https:// — ver LEIA-ME."},
{v:13,desc:"Financeiro dividido em três subtabs por pergunta de gestão: Orçamento (cumpro o plano?), Cobranças (estou a receber?) e Movimentos (o que aconteceu?). A nova subtab Cobranças reúne adjudicado por facturar, aging com botão de recebimento directo, imparidades e pendente por canal — antes espalhados por três sítios."},
{v:12,desc:"Auditoria: removido código morto (setFinSub, órfão desde a mudança para barra lateral) e corrigida a migração para inicializar budget2027, timeCostMonth e lastBackup em instalações antigas — sem isso o Orçamento 2027 abria sempre com pressupostos por omissão em vez dos guardados."},
{v:11,desc:"Coluna e KPI de ARR nas Vendas com edição inline; nova tab ARR com detalhe da receita recorrente por cliente; novo construtor de Orçamento 2027 bottom-up (base recorrente, churn, aumento de preço, novo negócio, upsell) com verificação de capacidade comercial."},
{v:10,desc:"Painel \"Ação necessária\" no Dashboard; próxima ação e data de follow-up por deal com alertas de atraso; KPI Directo vs Canal; stress-test de concentração do pipeline; aviso de créditos de cobrança duvidosa (>180 dias); custo nocional do tempo e break-even real; restauro de backup e verificação de integridade; exportação CSV para contabilidade; impressão da Estratégia."}

var D,cTab="dashboard",hcDone=false,finSub="orcamento";
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function storageBytes(){try{return new Blob([JSON.stringify(D)]).size}catch(e){try{return JSON.stringify(D).length}catch(e2){return 0}}}
function storagePct(){return Math.min(100,Math.round(storageBytes()/5242880*100))}/* 5MB referência */
function fmtKB(b){return b<1024?b+" B":b<1048576?(b/1024).toFixed(0)+" KB":(b/1048576).toFixed(1)+" MB"}
var ATT_MAX=1572864;/* 1,5 MB por ficheiro */
function logAct(type,desc){D.activities.unshift({id:uid(),type:type,date:new Date().toISOString().slice(0,10),desc:desc,auto:true})}
function fmt(n){return Math.round(n).toLocaleString("pt-PT")+"€"}
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
var _yearSel=null;/* null = automático (ano mais recente) */
function yearsInData(){
  var set={};
  (D.deals||[]).forEach(function(d){if(d.date)set[+d.date.slice(0,4)]=1});
  (D.invoices||[]).forEach(function(i){if(i.date)set[+i.date.slice(0,4)]=1});
  var ys=Object.keys(set).map(Number).filter(function(y){return y>=2020&&y<=2100});
  if(!ys.length)ys=[2026];
  return ys.sort(function(a,b){return b-a});
}
function activeYear(){
  if(_yearSel!==null)return _yearSel;
  return Math.max.apply(null,yearsInData().concat([2026]));
}
function yStart(){return activeYear()+"-01-01"}
function yEnd(){return activeYear()+"-12-31"}
function inYear(dt){if(_yearSel==="all")return !!dt;return dt>=yStart()&&dt<=yEnd()}
function beforeYear(dt){if(_yearSel==="all")return false;return dt<yStart()}
function setYear(v){_yearSel=(v==="auto"?null:(v==="all"?"all":+v));ren()}
function yearLabel(){return _yearSel==="all"?"Total":String(activeYear())}
function yearPicker(){
  var ys=yearsInData();
  var cur=activeYear();
  var opts='<option value="auto"'+(_yearSel===null?" selected":"")+'>Ano '+cur+' (auto)</option>';
  ys.forEach(function(y){opts+='<option value="'+y+'"'+(_yearSel===y?" selected":"")+'>Ano '+y+'</option>'});
  opts+='<option value="all"'+(_yearSel==="all"?" selected":"")+'>Total (todos os anos)</option>';
  return '<select onchange="setYear(this.value)" style="border:1px solid #ece6dc;border-radius:8px;padding:6px 10px;font-size:12px;font-family:inherit;font-weight:600;color:#5a5347;background:#fff;cursor:pointer">'+opts+'</select>';
}
function fmtD(d){return d?new Date(d).toLocaleDateString("pt-PT",{day:"numeric",month:"short"}):"—"}
function pc(a,b){return b>0?((a/b)*100).toFixed(1):"0"}
function cn(id){var c=D.clients.find(function(x){return x.id===id});return c?c.name:"—"}
function isWon(d){return d.stage==="ganho"||d.stage==="projeto"||d.stage==="concluido"}
function isClosed(d){return d.stage==="ganho"||d.stage==="projeto"||d.stage==="concluido"||d.stage==="perdido"}
function rgba(hex,a){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return"rgba("+r+","+g+","+b+","+a+")"}
function bdg(t,c){return'<span style="display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;background:'+rgba(c,.1)+';color:'+c+'">'+t+'</span>'}
function barH(l,v,mx,c){var w=mx>0?Math.max((v/mx)*100,2):0;return'<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div style="width:72px;font-size:12px;text-align:right;color:#7a7268;flex-shrink:0">'+l+'</div><div style="flex:1;height:24px;background:#f8f7f5;border-radius:6px;overflow:hidden"><div style="width:'+w+'%;height:100%;border-radius:6px;background:'+rgba(c,.25)+';display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;font-weight:600;color:'+c+';min-width:40px">'+fmt(v)+'</div></div></div>'}
function kpi(l,v,s,c,ac){return'<div class="kpi"><div class="bar" style="background:'+(ac||G)+'"></div><div class="kl">'+l+'</div><div class="kv" style="color:'+c+'">'+v+'</div>'+(s?'<div class="ks">'+s+'</div>':'')+'</div>'}
function pgHead(icon,title,action){return'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px"><div style="display:flex;align-items:center;gap:11px"><div style="width:34px;height:34px;border-radius:10px;background:'+rgba(R,.1)+';display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">'+icon+'</div><h2 style="font-size:19px;font-weight:600;color:#1a1713;letter-spacing:-.2px">'+title+'</h2></div>'+(action||'')+'</div>'}
function selF(lbl,opts,val,onch){var h='<div><label style="font-size:10px;color:#7a7268;display:block;margin-bottom:3px">'+lbl+'</label><select onchange="'+onch+'" style="border:1px solid #e5e0da;border-radius:6px;padding:5px 8px;font-size:12px;font-family:inherit;background:#fff;color:#3a352e">';opts.forEach(function(o){h+='<option value="'+o+'"'+(o===val?" selected":"")+'>'+o+'</option>'});h+='</select></div>';return h}
function clRowsHtml(){
  var ctF=window._ctF||{region:"Todos",channel:"Todos",spec:"Todos",at:"Todos",name:""};
  var q=String(ctF.name||"").toLowerCase();
  var ctList=D.clients.filter(function(cl){
    if(ctF.region!=="Todos"&&cl.region!==ctF.region)return false;
    if(ctF.channel!=="Todos"&&cl.channel!==ctF.channel)return false;
    if(q&&cl.name.toLowerCase().indexOf(q)<0)return false;
    var specs=D.clientSpecs.filter(function(s){return s.clientId===cl.id});
    if(ctF.spec!=="Todos"&&!specs.some(function(s){return s.specialty===ctF.spec}))return false;
    if(ctF.at==="Com AT"&&!specs.some(function(s){return s.at}))return false;
    if(ctF.at==="Sem AT"&&specs.some(function(s){return s.at}))return false;
    return true;
  }).sort(function(a,b){return a.name.localeCompare(b.name)});
  if(ctList.length===0)return '<tr><td colspan="5" style="text-align:center;padding:24px;color:#7a7268;font-size:13px">Sem clientes para estes filtros</td></tr>';
  var h="";
  ctList.forEach(function(cl){
    var specs=D.clientSpecs.filter(function(s){return s.clientId===cl.id});
    h+='<tr><td><a onclick="openClient(\''+cl.id+'\')" style="font-weight:600;color:'+R+';cursor:pointer;text-decoration:none;border-bottom:1px dotted '+rgba(R,.4)+'" title="Ver ficha, morada e contactos">'+esc(cl.name)+'</a>'+((D.contacts||[]).filter(function(x){return x.clientId===cl.id}).length?' <span style="font-size:9px;color:#a89d8d">\ud83d\udc64'+(D.contacts||[]).filter(function(x){return x.clientId===cl.id}).length+'</span>':'')+'</td><td>'+cl.region+'</td><td>'+cl.channel+'</td><td>';

  if(D.lastBackup===undefined){D.lastBackup="";changed=true}
  if(D.autoBackupDays===undefined){D.autoBackupDays=7;changed=true}
  INIT.changelog.forEach(function(c){if(!D.changelog.find(function(x){return x.v===c.v})){D.changelog.push(JSON.parse(JSON.stringify(c)));changed=true}});
  D.deals.forEach(function(d){if(d.mrr!==undefined&&d.arr===undefined){d.arr=d.mrr;delete d.mrr;changed=true}});
  INIT.clients.forEach(function(c){if(!D.clients.find(function(x){return x.id===c.id})){D.clients.push(JSON.parse(JSON.stringify(c)));changed=true}});
  INIT.deals.forEach(function(d){if(!D.deals.find(function(x){return x.id===d.id})){D.deals.push(JSON.parse(JSON.stringify(d)));changed=true}});
  INIT.invoices.forEach(function(iv){if(!D.invoices.find(function(x){return x.id===iv.id})){D.invoices.push(JSON.parse(JSON.stringify(iv)));changed=true}});
  INIT.clientSpecs.forEach(function(s){if(!D.clientSpecs.find(function(x){return x.id===s.id})){D.clientSpecs.push(JSON.parse(JSON.stringify(s)));changed=true}});
  INIT.expenses.forEach(function(e){if(!D.expenses.find(function(x){return x.id===e.id})){D.expenses.push(JSON.parse(JSON.stringify(e)));changed=true}});
  if((D.dataVersion||1)<2){
    ["d6","d7","d8","d9","d10","d12","d13","d15"].forEach(function(id){var dl=D.deals.find(function(x){return x.id===id});var src=INIT.deals.find(function(x){return x.id===id});if(dl&&src)Object.assign(dl,JSON.parse(JSON.stringify(src)))});
    D.expenses=JSON.parse(JSON.stringify(INIT.expenses));
    changed=true;
  }
  if((D.dataVersion||1)<3){
    ["d6","d7","d8","d9","d10","d13","d33"].forEach(function(id){var dl=D.deals.find(function(x){return x.id===id});var src=INIT.deals.find(function(x){return x.id===id});if(dl&&src)Object.assign(dl,JSON.parse(JSON.stringify(src)))});
    D.invoices=D.invoices.filter(function(iv){return iv.dealId!=="d33"&&iv.dealId!=="d22"});
    changed=true;
  }
  if((D.dataVersion||1)<4){
    D.clients=D.clients.filter(function(c){return c.id!=="c12"&&c.id!=="c16"});
    D.deals=D.deals.filter(function(d){return d.clientId!=="c12"&&d.clientId!=="c16"});
    var c9f=D.clients.find(function(c){return c.id==="c9"});if(c9f)c9f.name="Almeria - Torrecárdenas";
    var c10f=D.clients.find(function(c){return c.id==="c10"});if(c10f)c10f.name="Almeria - Inmaculada";
    D.expenses=JSON.parse(JSON.stringify(INIT.expenses));
    changed=true;
  }
  if((D.dataVersion||1)<5){
    ["d18","d19","d20","d21","d23","d24","d25","d26","d27","d28","d29","d33"].forEach(function(id){
      D.deals=D.deals.filter(function(d){return d.id!==id});
      D.invoices=D.invoices.filter(function(iv){return iv.dealId!==id});
    });
    changed=true;
  }
  if((D.dataVersion||1)<6){
    ["d30","d31","d32"].forEach(function(id){var dl=D.deals.find(function(x){return x.id===id});var src=INIT.deals.find(function(x){return x.id===id});if(dl&&src)Object.assign(dl,JSON.parse(JSON.stringify(src)))});
    var sp23f=D.clientSpecs.find(function(s){return s.id==="sp23"});if(sp23f)sp23f.specialty="Gastro";
    changed=true;
  }
  if((D.dataVersion||1)<7){
    D.deals=D.deals.filter(function(d){return d.id!=="d13"});
    D.invoices=D.invoices.filter(function(iv){return iv.dealId!=="d13"});
    changed=true;
  }
  if((D.dataVersion||1)<8){
    D.deals=D.deals.filter(function(d){return!(d.clientId==="c6"&&Math.abs(d.value-47432)<1&&d.id!=="d34")});
    if(!D.activities.find(function(a){return a.id==="a00"}))D.activities.unshift(JSON.parse(JSON.stringify(INIT.activities.find(function(a){return a.id==="a00"}))));
    changed=true;
  }
  if((D.dataVersion||1)<INIT.dataVersion){D.dataVersion=INIT.dataVersion;changed=true}
  if(changed)save();
}

function saveSettings(){var b=Number(document.getElementById("setBudget").value)||D.budget;var t=Number(document.getElementById("setTime").value)||0;var bk=Number(document.getElementById("setBk").value);if(isNaN(bk))bk=7;D.budget=b;D.timeCostMonth=t;D.autoBackupDays=bk;logAct("Nota","Definições actualizadas: objectivo "+fmt(b)+", custo tempo "+fmt(t)+"/mês, backup cada "+bk+" dias");save();ren()}
function daysSinceBackup(){if(!D.lastBackup)return null;return Math.floor((new Date()-new Date(D.lastBackup))/86400000)}
function integrityCheck(){var p=[];
  (D.attachments||[]).forEach(function(a){if(!D.deals.find(function(d){return d.id===a.dealId}))p.push("Anexo \""+a.name+"\" sem deal válido")});
  D.deals.forEach(function(d){if(!D.clients.find(function(c){return c.id===d.clientId}))p.push("Deal "+d.id+" sem cliente válido")});
  D.invoices.forEach(function(i){if(!D.deals.find(function(d){return d.id===i.dealId}))p.push("Factura "+i.id+" sem deal válido")});
  D.clientSpecs.forEach(function(sp){if(!D.clients.find(function(c){return c.id===sp.clientId}))p.push("Especialidade "+sp.id+" sem cliente válido")});
  ["clients","deals","invoices","expenses"].forEach(function(k){var seen={};(D[k]||[]).forEach(function(x){if(seen[x.id])p.push("ID duplicado em "+k+": "+x.id);seen[x.id]=1})});
  return p}

function st(){
  var inv=0,col=0,exp=0,pend=0,pendPrev=0,cash=0;
  D.invoices.forEach(function(i){if(inYear(i.date)){inv+=i.amount}if(i.collected&&inYear(i.collDate)){col+=i.amount;cash+=i.amount}if(!i.collected){pend+=i.amount;if(beforeYear(i.date))pendPrev+=i.amount}});
  D.expenses.forEach(function(e){exp+=e.amount});
  var pipe=0;D.deals.forEach(function(d){if(!isClosed(d)&&inYear(d.date)){pipe+=d.value}});
  var debtCh={};D.invoices.forEach(function(i){if(i.collected)return;var d=D.deals.find(function(x){return x.id===i.dealId});var c=d?D.clients.find(function(x){return x.id===d.clientId}):null;var ch=c?c.channel:"Outro";debtCh[ch]=(debtCh[ch]||0)+i.amount});
  var debt=pend;
  var mo={};D.expenses.forEach(function(e){var m=new Date(e.date).getMonth();mo[m]=(mo[m]||0)-e.amount});
  D.invoices.forEach(function(i){if(i.collected&&i.collDate){var m=new Date(i.collDate).getMonth();mo[m]=(mo[m]||0)+i.amount}});
  var cf=[];for(var m=0;m<12;m++){cf.push({m:MO[m],v:Math.round(mo[m]||0)})}
  var bs={},eb={},bc={};
  D.invoices.forEach(function(i){if(beforeYear(i.date)){return}var d=D.deals.find(function(x){return x.id===i.dealId});if(d){bs[d.specialty]=(bs[d.specialty]||0)+i.amount;var c=D.clients.find(function(x){return x.id===d.clientId});if(c){bc[c.channel]=(bc[c.channel]||0)+i.amount}}});
  D.expenses.forEach(function(e){var k=e.client||e.type;eb[k]=(eb[k]||0)+e.amount});
  return{inv:inv,col:col,pend:pend,pendPrev:pendPrev,exp:exp,cf2:cash-exp,pipe:pipe,debt:debt,debtCh:debtCh,cfd:cf,bs:bs,eb:eb,bc:bc,pB:pc(inv,D.budget),cR:pc(col,col+pend),pN:D.deals.filter(function(d){return d.stage==="proposta"&&inYear(d.date)}).length};
}

function initMap(){var el=document.getElementById("leaflet-map");if(!el)return;
  try{if(window._map){window._map.remove();window._map=null}}catch(e){}
  try{if(window._mapCan){window._mapCan.remove();window._mapCan=null}}catch(e){}
  try{
  var map=L.map("leaflet-map",{zoomControl:true}).setView([39.8,-3.5],6);window._map=map;
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{attribution:"OSM/CARTO",maxZoom:18}).addTo(map);
  function mkMarker(cl,onMap){var ds=D.deals.filter(function(d){return d.clientId===cl.id});var w=ds.some(function(d){return isWon(d)});var p=ds.some(function(d){return d.stage==="proposta"||d.stage==="projeto"});var c=w?GRN:p?G:R;var sz=ds.reduce(function(m,d){return Math.max(m,d.value)},0)>20000?22:16;var mk=L.marker([cl.lat,cl.lng],{icon:L.divIcon({className:"",html:'<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+c+';border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]})}).addTo(onMap);mk.bindPopup('<b>'+cl.name+'</b><br>'+cl.region)}
  var mainPts=[],canPts=[];

  setTimeout(function(){map.invalidateSize()},300);

  if(best)return best;
  var toks=n.split(" ");
  D.clients.forEach(function(c){if(best)return;var ct=normName(c.name).split(" ").filter(function(t){return t.length>=4});
    if(ct.length&&ct.some(function(t){return toks.indexOf(t)>=0}))best=c});
  return best}
function isExcludedClient(name){var n=normName(name);return(INIT.exclusionRules.clients||[]).some(function(ex){return n.indexOf(ex)>=0})}
function isExcludedDeal(clientId,value){return(INIT.exclusionRules.deals||[]).some(function(ex){return ex.clientId===clientId&&Math.abs(ex.value-value)<1})}
function lightNorm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim()}
function isExcludedCrmText(text,value){var n=lightNorm(text);return(INIT.exclusionRules.crmText||[]).some(function(ex){return n.indexOf(ex.contains)>=0&&Math.abs(ex.value-value)<1})}
function parseXlDate(v){if(!v)return"2026-01-01";var s=String(v).trim();var m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(m){var mm=("0"+m[1]).slice(-2),dd=("0"+m[2]).slice(-2),yy=m[3].length===2?"20"+m[3]:m[3];return yy+"-"+mm+"-"+dd}
  var MON={jan:"01",fev:"02",feb:"02",mar:"03",abr:"04",apr:"04",mai:"05",may:"05",jun:"06",jul:"07",ago:"08",aug:"08",set:"09",sep:"09",out:"10",oct:"10",nov:"11",dez:"12",dec:"12"};
  var m2=s.match(/^([a-zA-Z]{3})\/(\d{2,4})$/);if(m2){var mon=MON[m2[1].toLowerCase()];if(mon){var yy2=m2[2].length===2?"20"+m2[2]:m2[2];return yy2+"-"+mon+"-01"}}
  var m3=s.match(/^(\d{1,2})\/([a-zA-Z]{3})\/(\d{2,4})$/);if(m3){var mon2=MON[m3[2].toLowerCase()];if(mon2){var yy3=m3[3].length===2?"20"+m3[3]:m3[3];return yy3+"-"+mon2+"-"+("0"+m3[1]).slice(-2)}}
  var d=new Date(s);if(!isNaN(d)&&d.getFullYear()>2010)return d.toISOString().slice(0,10);return"2026-01-01"}

function parseCustos(wb){var ws=wb.Sheets["Custos"];if(!ws)return 0;var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});var h=findHdrRow(rows,["data","valor"]);if(h<0)return 0;var hdr=rows[h];var iD=colIdx(hdr,"data"),iV=colIdx(hdr,"valor"),iT=colIdx(hdr,"tipo"),iB=colIdx(hdr,"banco"),iC=colIdx(hdr,"cliente");var added=0;

function parsePipeLine(wb){var ws=wb.Sheets["Pipe Line"];if(!ws)return{items:[],excluded:0};var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});var h=findHdrRow(rows,["cliente"]);if(h<0)return{items:[],excluded:0};var hdr=rows[h];var iCli=colIdx(hdr,"cliente"),iProd=colIdx(hdr,"produto"),iVal=colIdx(hdr,"s/"),iDate=colIdx(hdr,"adjud"),iFact=colIdx(hdr,"fact."),iPag=colIdx(hdr,"pagam");var out=[],excluded=0;
  for(var r=h+1;r<rows.length;r++){var row=rows[r];if(!row||!row[iCli])continue;var cliRaw=String(row[iCli]).trim();if(isExcludedClient(cliRaw)){excluded++;continue}var val=parseFloat(String(row[iVal]||"0").replace(",",""))||0;if(val<=0)continue;var prod=String(row[iProd]||"").trim();var dt=parseXlDate(row[iDate]);var pag=String(row[iPag]||"").toLowerCase();var fact=row[iFact];var stageGuess=fact?"ganho":"proposta";var match=matchClient(cliRaw);

function parseCRM(wb){var ws=wb.Sheets[wb.SheetNames[0]];if(!ws)return{items:[],excluded:0};var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});if(!rows.length)return{items:[],excluded:0};var hdr=rows[0];var iOp=colIdx(hdr,"oportunidade"),iRet=colIdx(hdr,"retorno"),iMrr=colIdx(hdr,"mrr"),iEt=colIdx(hdr,"etapa");function mapStage(et){if(et.indexOf("conclu")>=0||et.indexOf("ganho")>=0||et.indexOf("adjudicad")>=0)return"ganho";if(et.indexOf("proposta")>=0)return"proposta";if(et.indexOf("projeto")>=0||et.indexOf("projecto")>=0)return"projeto";return"lead"}var out=[],excluded=0;
  for(var r=1;r<rows.length;r++){var row=rows[r];if(!row||!row[iOp])continue;var opTxt=String(row[iOp]);var val=parseFloat(String(row[iRet]||"0").replace(/,/g,""))||0;var mrrv=parseFloat(String(row[iMrr]||"0").replace(/,/g,""))||0;var et=String(row[iEt]||"").toLowerCase().trim();var stage=mapStage(et);

    out.push({opTxt:opTxt,clientId:match?match.id:null,clientName:match?match.name:null,value:val,arr:mrrv*12,stage:stage});

// Anos do histórico: anos com faturas são calculados dinamicamente (faturação, split NV/AT);
// anos antigos sem dados na app ficam com o registo histórico curado (HIST).
function histYears(){
  var by={};
  (D.invoices||[]).forEach(function(i){
    var y=+String(i.date||"").slice(0,4); if(!y)return;
    if(!by[y])by[y]={tot:0,nv:0,at:0,cli:{}};
    var dl=(D.deals||[]).find(function(x){return x.id===i.dealId});
    var isAT=dl&&dl.type==="AT";
    by[y].tot+=i.amount||0; if(isAT)by[y].at+=i.amount||0; else by[y].nv+=i.amount||0;
    if(dl)by[y].cli[dl.clientId]=1;
  });
  var out={};
  (HIST||[]).forEach(function(h){out[h.yr]=Object.assign({},h);});
  var curY=(typeof activeYear==="function"?activeYear():2026);
  Object.keys(by).forEach(function(ys){
    var y=+ys, b=by[y], base=out[y]||{yr:y,nc:0,obj:0};
    out[y]={yr:y,tot:Math.round(b.tot),nv:Math.round(b.nv),at:Math.round(b.at),
      nc:base.nc||0, obj:(y>=2026?D.budget:(base.obj||0)), ncli:Object.keys(b.cli).length,
      note:(y>=curY?"LIVE — dados da app":"LIVE — faturado"), partial:(y>=curY)};
  });
  return Object.keys(out).map(function(y){return out[y];}).sort(function(a,b){return a.yr-b.yr;});
}

var deferredPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredPrompt=e;var b=document.getElementById("btnInstall");if(b)b.style.display="";});
function doInstall(){
  if(!deferredPrompt){
    var iOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
    toast(iOS
      ? "Para instalar no iPhone/iPad:\n\n1. Toca no botão Partilhar (quadrado com seta)\n2. Escolhe \"Adicionar ao Ecrã Principal\"\n3. Confirma em Adicionar"
      : "Para instalar:\n\nAbre o menu do browser (⋮) e escolhe \"Instalar aplicação\" ou \"Adicionar ao ecrã principal\".\n\nNota: a instalação só funciona quando a app é aberta a partir de um endereço https:// — não a partir de um ficheiro local.",{icon:"📲"});
    return;
  }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(c){
    if(c.outcome==="accepted"){var b=document.getElementById("btnInstall");if(b)b.style.display="none";}
    deferredPrompt=null;
  });
}
window.addEventListener("appinstalled",function(){var b=document.getElementById("btnInstall");if(b)b.style.display="none";deferredPrompt=null;});
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(e){console.log("SW não registado:",e.message)});
  });
}

  var standalone=(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||(window.navigator&&window.navigator.standalone===true);

})();

  function agePill(d){if(d==null)return pill("—",SL);var c=d>=90?R:(d>=AGE?GD:GRN);return pill(d+" d",c);}
  function openDeals(){return D.deals.filter(function(d){return OPEN.indexOf(d.stage)>=0;}).map(function(d){var c=D.clients.find(function(x){return x.id===d.clientId})||{};return {d:d,cli:cn(d.clientId),region:c.region||"",channel:c.channel||"",days:daysOf(d.date)};});}

  function computeList(all){
    var l=all.slice();
    if(ui.search)l=l.filter(function(o){return o.cli.toLowerCase().indexOf(ui.search.toLowerCase())>=0;});
    if(ui.stalled)l=l.filter(function(o){return o.days!=null&&o.days>=AGE;});
    if(ui.leads)l=l.filter(function(o){return o.d.stage==="lead";});
    var srt={days:function(a,b){return (b.days==null?-1:b.days)-(a.days==null?-1:a.days);},value:function(a,b){return (b.d.value||0)-(a.d.value||0);},prob:function(a,b){return prob(b.d)-prob(a.d)||(b.d.value||0)-(a.d.value||0);},cliente:function(a,b){return a.cli.localeCompare(b.cli);}};
    l.sort(srt[ui.sort]||srt.days);
    return l;
  }

  function paintTable(){
    var all=openDeals();
    var totalVal=all.reduce(function(a,o){return a+(o.d.value||0);},0);
    var weighted=all.reduce(function(a,o){return a+(o.d.value||0)*prob(o.d);},0);
    var stalled=all.filter(function(o){return o.days!=null&&o.days>=AGE;});
    var stalledVal=stalled.reduce(function(a,o){return a+(o.d.value||0);},0);
    var leads=all.filter(function(o){return o.d.stage==="lead";});
    document.getElementById("fupKpis").innerHTML=
      kpi("Pipeline em aberto",fmt(totalVal),all.length+" oportunidades por fechar",R,R)+
      kpi("Pipeline ponderado",fmt(weighted),"valor esperado por probabilidade",GRN,GRN)+
      kpi("Parados >"+AGE+" dias",fmt(stalledVal),stalled.length+" em risco de arrefecer",GD,G)+
      kpi("Leads a qualificar",String(leads.length),"sem valor — primeiro contacto",PUR,PUR);

    var preStalled=all.filter(function(o){return o.d.stage!=="lead"&&o.days!=null&&o.days>=AGE;}).sort(function(a,b){return (b.d.value||0)-(a.d.value||0);});
    var ab=document.getElementById("fupAlert");
    if(preStalled.length){ab.innerHTML='<div class="cd" style="border-left:3px solid '+GD+';background:'+rgba(G,.06)+';display:flex;gap:10px;align-items:flex-start;margin-bottom:20px"><span style="font-size:17px">⏰</span><div style="font-size:12.5px;line-height:1.55;color:#6d4413"><b>'+preStalled.length+' oportunidade'+(preStalled.length>1?"s":"")+' com proposta a arrefecer</b> — '+fmt(preStalled.reduce(function(a,o){return a+(o.d.value||0);},0))+' parados há mais de '+AGE+' dias. Prioridade de contacto: '+preStalled.slice(0,3).map(function(o){return esc(o.cli);}).join(", ")+(preStalled.length>3?"…":"")+'.</div></div>';}else ab.innerHTML="";

    var list=computeList(all);
    document.getElementById("fupCnt").textContent="("+list.length+")";
    var per=15,pages=Math.ceil(list.length/per)||1;if(ui.page>=pages)ui.page=0;
    var slice=list.slice(ui.page*per,ui.page*per+per);
    var stOpts=function(s){var o='<option value="">— definir —</option>';FUP_STATUS.forEach(function(x){o+='<option'+(s===x?" selected":"")+'>'+x+'</option>';});return o;};
    var t=document.getElementById("fupTbl");
    t.innerHTML='<thead><tr><th>Cliente</th><th>Oportunidade</th><th style="min-width:118px">Etapa</th><th style="text-align:right">Em aberto</th><th style="text-align:right">Prob.</th><th style="text-align:right">Parado</th><th style="min-width:150px">Estado follow-up</th><th style="min-width:180px">Próximo passo</th><th style="min-width:90px">Resp.</th><th style="min-width:130px">Próx. data</th></tr></thead><tbody>'+
      (slice.length?slice.map(function(o){var d=o.d;
        return '<tr>'+
          '<td><div style="font-weight:600;color:#1a1713">'+esc(o.cli)+'</div><div style="font-size:10.5px;color:#a89d8d;margin-top:1px">'+esc(o.region||"—")+(o.channel?" · "+esc(o.channel):"")+'</div></td>'+
          '<td><div style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(d.product)+'">'+esc(d.product)+'</div><div style="margin-top:3px;display:flex;gap:4px;flex-wrap:wrap">'+bdg(d.specialty,SL)+bdg(d.type,TEAL)+'</div></td>'+
          '<td><select onchange="__fupMove(\''+d.id+'\',this.value)" title="Mudar etapa no pipeline" style="border:1px solid '+rgba(SC[d.stage],.35)+';color:'+SC[d.stage]+';background:'+rgba(SC[d.stage],.09)+';border-radius:6px;padding:4px 7px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer">'+STAGES.map(function(s){return '<option value="'+s+'"'+(s===d.stage?" selected":"")+'>'+SL2[s]+'</option>';}).join("")+'</select></td>'+
          '<td style="text-align:right;font-weight:600;font-variant-numeric:tabular-nums">'+(d.value>0?fmt(d.value):'<span style="color:#c4bbac">—</span>')+'</td>'+
          '<td style="text-align:right;font-weight:700;font-variant-numeric:tabular-nums">'+Math.round(prob(d)*100)+'%</td>'+
          '<td style="text-align:right">'+agePill(o.days)+'</td>'+
          '<td><select class="fupF" data-id="'+d.id+'" data-f="fupStatus" style="border:1px solid #e5e0da;border-radius:6px;padding:5px 7px;font-size:11.5px;background:#fff;width:100%;min-width:135px;font-family:inherit">'+stOpts(d.fupStatus||"")+'</select></td>'+
          '<td><input class="fupF" data-id="'+d.id+'" data-f="nextAction" value="'+esc(d.nextAction||"").replace(/"/g,"&quot;")+'" placeholder="próximo passo..." style="border:1px solid #e5e0da;border-radius:6px;padding:5px 7px;font-size:11.5px;width:100%;font-family:inherit;outline:none"></td>'+
          '<td><input class="fupF" data-id="'+d.id+'" data-f="fupOwner" value="'+esc(d.fupOwner||"").replace(/"/g,"&quot;")+'" placeholder="—" style="border:1px solid #e5e0da;border-radius:6px;padding:5px 7px;font-size:11.5px;width:100%;font-family:inherit;outline:none"></td>'+
          '<td><input class="fupF" type="date" data-id="'+d.id+'" data-f="nextDate" value="'+esc(d.nextDate||"")+'" style="border:1px solid #e5e0da;border-radius:6px;padding:5px 7px;font-size:11.5px;width:100%;font-family:inherit;outline:none"></td>'+
          '</tr>';
      }).join(""):'<tr><td colspan="10" style="text-align:center;padding:26px;color:#a89d8d;font-size:12.5px">Sem oportunidades em aberto para os filtros aplicados.</td></tr>')+'</tbody>';

    t.querySelectorAll("select.fupF").forEach(function(s){s.onchange=function(){var d=D.deals.find(function(x){return x.id===s.dataset.id;});if(d){d[s.dataset.f]=s.value;save();}paintTable();};});
    t.querySelectorAll("input.fupF").forEach(function(inp){var w=function(){var d=D.deals.find(function(x){return x.id===inp.dataset.id;});if(d){d[inp.dataset.f]=inp.value;save();}};inp.oninput=w;if(inp.type==="date")inp.onchange=w;});

    var pg=document.getElementById("fupPager");
    if(pages>1){pg.innerHTML='<button class="btn bs" style="background:#f4f0e8;color:#7a7268" '+(ui.page===0?"disabled":"")+' data-p="'+(ui.page-1)+'">‹</button><span style="font-size:12px;color:#a89d8d">Página '+(ui.page+1)+' de '+pages+'</span><button class="btn bs" style="background:#f4f0e8;color:#7a7268" '+(ui.page>=pages-1?"disabled":"")+' data-p="'+(ui.page+1)+'">›</button>';pg.querySelectorAll("button[data-p]").forEach(function(b){b.onclick=function(){ui.page=parseInt(b.dataset.p,10);paintTable();};});}else pg.innerHTML="";
  }

  function paintMeetings(){
    if(!Array.isArray(D.meetings))D.meetings=[];
    var q=(ui.mSearch||"").toLowerCase();
    var ms=D.meetings.slice().sort(function(a,b){return (b.date||"").localeCompare(a.date||"");});
    if(q)ms=ms.filter(function(m){return (m.tags||[]).some(function(t){return t.toLowerCase().indexOf(q)>=0;})||(m.notes||"").toLowerCase().indexOf(q)>=0||(m.cliTag||"").toLowerCase().indexOf(q)>=0;});
    var el=document.getElementById("fupMtgList");
    el.innerHTML=ms.length?ms.map(function(m){
      var dt=m.date?new Date(m.date+"T00:00:00").toLocaleDateString("pt-PT",{day:"2-digit",month:"short",year:"numeric"}):"—";
      return '<div id="mtg-'+m.id+'" style="border:1px solid #ece6dc;border-radius:11px;padding:14px 16px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div style="font-weight:700;font-size:13px">'+dt+'</div><button class="fupEditMtg btn bs" data-id="'+m.id+'" style="background:#f4f0e8;color:#7a7268">Editar</button></div>'+

        ((m.tags&&m.tags.length)?'<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px">'+m.tags.map(function(t){var isC=m.cliTag&&t.toLowerCase()===m.cliTag.toLowerCase();return bdg(t,isC?R:SL);}).join("")+'</div>':"")+
        '<div style="font-size:12.5px;color:#4a453d;white-space:pre-wrap;line-height:1.55">'+esc(m.notes||"—")+'</div></div>';
    }).join(""):'<div style="text-align:center;padding:24px;color:#a89d8d;font-size:12.5px">'+(q?"Sem reuniões para esta pesquisa.":'Sem reuniões registadas. Usa "+ Registar reunião" para começar.')+'</div>';

  function openMtg(id){
    if(!Array.isArray(D.meetings))D.meetings=[];
    var m=id?D.meetings.find(function(x){return x.id===id;}):null;
    var all=openDeals();var totalVal=all.reduce(function(a,o){return a+(o.d.value||0);},0);
    var stalled=all.filter(function(o){return o.days!=null&&o.days>=AGE;}).length;
    var leads=all.filter(function(o){return o.d.stage==="lead";}).length;
    var defNotes=m?(m.notes||""):("Pipeline em aberto: "+fmt(totalVal)+" ("+all.length+" oportunidades).\nParados >"+AGE+"d: "+stalled+".\nLeads a qualificar: "+leads+".\n\nDecisões / próximos passos:\n- ");
    var cliDL='<datalist id="fupCliDL">'+D.clients.map(function(c){return '<option value="'+esc(c.name)+'">';}).join("")+'</datalist>';
    var body=fld("Título da reunião",'<input id="fm0" placeholder="ex.: Revisão de pipeline Q3" value="'+(m?esc(m.title||""):"")+'">')
      +fld("Data da reunião",'<input type="date" id="fm1" value="'+(m?m.date:new Date().toISOString().slice(0,10))+'">')
      +fld("Cliente associado (opcional)",'<input id="fm2" list="fupCliDL" placeholder="ex.: IMED Valencia" value="'+(m?esc(m.cliTag||""):"")+'">'+cliDL)
      +fld("Tags (separadas por vírgula)",'<input id="fm3" placeholder="ex.: pipeline, Q3, IMED" value="'+(m?esc((m.tags||[]).join(", ")):"")+'">')
      +fld("Notas / decisões",'<textarea id="fm4" rows="7" style="resize:vertical">'+esc(defNotes)+'</textarea>')
      +'<div style="display:flex;gap:8px;margin-top:6px">'+(id?'<button class="btn" style="background:#fff;color:'+R+';border:1px solid '+rgba(R,.35)+';margin-right:auto" id="fmDel">Eliminar</button>':"")+'<button class="btn" style="background:#f4f0e8;color:#7a7268;flex:'+(id?"0 0 auto":"1")+'" onclick="clM()">Cancelar</button><button class="btn" style="background:'+R+';flex:1" id="fmSave">Guardar</button></div>';
    document.getElementById("mArea").innerHTML=mWrap(id?"Editar reunião":"Registar reunião de follow-up",body);
    document.getElementById("fmSave").onclick=function(){
      var cliTag=document.getElementById("fm2").value.trim();
      var tags=document.getElementById("fm3").value.split(",").map(function(t){return t.trim();}).filter(Boolean);
      if(cliTag&&!tags.some(function(t){return t.toLowerCase()===cliTag.toLowerCase();}))tags.push(cliTag);
      var rec={title:document.getElementById("fm0").value.trim(),date:document.getElementById("fm1").value||new Date().toISOString().slice(0,10),notes:document.getElementById("fm4").value.trim(),cliTag:cliTag,tags:tags};
      if(id){Object.assign(D.meetings.find(function(x){return x.id===id;}),rec);}else{rec.id=uid();D.meetings.push(rec);if(typeof logAct==="function")logAct("Nota","Reunião de follow-up registada"+(cliTag?" — "+cliTag:""));}
      save();clM();if(typeof toast==="function")toast("Reunião guardada",{type:"ok"});renderFollowup();
    };
    if(id){document.getElementById("fmDel").onclick=function(){confirmM("Eliminar esta reunião do registo?",function(){D.meetings=D.meetings.filter(function(x){return x.id!==id;});save();clM();renderFollowup();},{yesLabel:"Eliminar"});};}
  }

      h+='<div style="font-size:12.5px;color:#3a352e;line-height:1.7">';
      if(cl.address)h+='📍 '+esc(cl.address).replace(/\n/g,"<br>&nbsp;&nbsp;&nbsp;")+'<br>';

      h+='</div>';

  function buildContactos(cts){
    if(!cts.length)return '<div style="font-size:12px;color:#a89d8d">Sem contactos registados.</div>';

  function buildInstall(cl){

  function clientAtts(clientId){return (D.attachments||[]).filter(function(a){var dl=D.deals.find(function(d){return d.id===a.dealId;});return dl&&dl.clientId===clientId;});}

  function buildMeetings(ms){

    });
    return h;
  }

  // Parque instalado — modais (inalterados na lógica; reabrem a ficha na secção Parque)
  var INSTALL_PRESETS=["Licenças","Integração","Cloud","Nº Image Box","Nº ShareBox","DOCbase","Versão do sistema","PACS/RIS","Outro"];
  window.openInstallM=function(clientId,itemId){
    var cl=D.clients.find(function(c){return c.id===clientId;});if(!cl)return;
    var it=itemId?(cl.install||[]).filter(function(x){return x.id===itemId;})[0]:null;
    var dl='<datalist id="instPresets">'+INSTALL_PRESETS.map(function(x){return '<option value="'+x+'">';}).join("")+'</datalist>';
    var body=fld("Tipo / Produto",'<input id="inst1" list="instPresets" placeholder="ex.: Licenças, Integração, Cloud, Nº Image Box, ShareBox..." value="'+(it?esc(it.label):"")+'">'+dl)
      +fld("Valor",'<input id="inst2" placeholder="ex.: 5, HL7, Sim, 2..." value="'+(it?esc(it.value):"")+'">')
      +'<div style="display:flex;gap:8px;margin-top:6px"><button class="btn" style="background:#f4f0e8;color:#7a7268;flex:1" onclick="clM()">Cancelar</button><button class="btn" style="background:'+R+';flex:1" onclick="svInstall(\''+clientId+'\',\''+(itemId||"")+'\')">Guardar</button></div>';
    document.getElementById("mArea").innerHTML=mWrap(it?"Editar item":"Adicionar ao parque instalado",body);
  };
  window.svInstall=function(clientId,itemId){
    var cl=D.clients.find(function(c){return c.id===clientId;});if(!cl)return;
    var label=(document.getElementById("inst1").value||"").trim();
    var value=(document.getElementById("inst2").value||"").trim();
    if(!label){if(typeof toast==="function")toast("Indica o tipo/produto.",{type:"error"});return;}
    if(!Array.isArray(cl.install))cl.install=[];

    else{cl.install.push({id:uid(),label:label,value:value});}
    if(typeof logAct==="function")logAct("Cliente","Parque instalado ("+cn(clientId)+"): "+label+" = "+value);

  };
  window.delInstall=function(clientId,itemId){
    var cl=D.clients.find(function(c){return c.id===clientId;});if(!cl)return;
    var doIt=function(){cl.install=(cl.install||[]).filter(function(x){return x.id!==itemId;});if(typeof logAct==="function")logAct("Cliente","Item de parque removido ("+cn(clientId)+")");save();openClient(clientId,"parque");};

  // Substitui a ficha de cliente por uma versão em acordeão
  window.openClient=function(clientId,openKey){
    var cl=D.clients.find(function(c){return c.id===clientId;});if(!cl)return;
    var specs=(D.clientSpecs||[]).filter(function(x){return x.clientId===clientId;});
    var cts=(D.contacts||[]).filter(function(x){return x.clientId===clientId;});
    var ds=D.deals.filter(function(d){return d.clientId===clientId;});

    var open2=ds.filter(function(d){return !isClosed(d);}).reduce(function(a,d){return a+d.value;},0);
    var pend=D.invoices.filter(function(i){return !i.collected&&ds.some(function(d){return d.id===i.dealId;});}).reduce(function(a,i){return a+i.amount;},0);

    var b='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">'+bdg(cl.region,BLU)+bdg(cl.channel,SL)+specs.map(function(sp){return bdg(sp.specialty+(sp.at?" · AT":""),sp.at?GRN:GD);}).join("")+'</div>';
    b+='<div style="display:flex;gap:10px;flex-wrap:wrap">';
    [["Ganho",fmt(won),GRN],["Em aberto",fmt(open2),GD],["Por cobrar",fmt(pend),pend>0?R:SL]].forEach(function(k){
      b+='<div style="flex:1;min-width:90px;background:#f4f0e8;border-radius:10px;padding:10px 12px"><div style="font-size:9.5px;color:#a89d8d;text-transform:uppercase;letter-spacing:.4px;font-weight:600">'+k[0]+'</div><div style="font-size:15px;font-weight:700;color:'+k[2]+'">'+k[1]+'</div></div>';});
    b+='</div>';

    var editBtn=canEdit?'<button class="btn bs" style="background:'+SL+'" onclick="openAddrM(\''+clientId+'\')">✎ Editar</button>':"";
    var ctBtn=canEdit?'<button class="btn bs" style="background:'+R+'" onclick="openCtM({clientId:\''+clientId+'\'})">+ Contacto</button>':"";

  window.__fupMove=function(id,sg){

  // ===== P&L mensal (tabela Proveitos / Custos / Saldo) no topo do sub-tab P&L =====
  function fmt2(v){var n=Math.round(v*100)/100;n=n||0;return n.toLocaleString("pt-PT",{minimumFractionDigits:2,maximumFractionDigits:2});}
  function buildPLtable(){
    var fatM=new Array(12).fill(0);
    D.invoices.forEach(function(i){if(inYear(i.date)){fatM[new Date(i.date).getMonth()]+=i.amount;}});
    var types={};
    D.expenses.forEach(function(e){if(!inYear(e.date))return;var k=e.type||"Outros";if(!types[k])types[k]=new Array(12).fill(0);types[k][new Date(e.date).getMonth()]+=e.amount;});
    var LBL={Viagem:"Viagens",Marketing:"Marketing",Outro:"Outros",Outros:"Outros"};
    var order=["Viagem","Marketing","Outro","Outros"];
    var tkeys=Object.keys(types).sort(function(a,b){var ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});
    var costM=new Array(12).fill(0);tkeys.forEach(function(k){for(var m=0;m<12;m++)costM[m]+=types[k][m];});
    var saldoM=new Array(12).fill(0);for(var m=0;m<12;m++)saldoM[m]=fatM[m]-costM[m];
    var sum=function(a){return a.reduce(function(x,y){return x+y;},0);};

    var cell=function(v,opt){opt=opt||{};var c=opt.color||"#3a352e";var fw=opt.bold?"700":"500";return '<td style="text-align:right;padding:6px 9px;font-size:11px;font-variant-numeric:tabular-nums;color:'+c+';font-weight:'+fw+';white-space:nowrap;border-bottom:1px solid #f4f0e8">'+fmt2(v)+'</td>';};
    var monthHdr=function(label){var h='<tr style="background:#efe9df"><td style="padding:6px 10px;font-size:10.5px;font-weight:700;color:#6b6357;text-transform:uppercase;letter-spacing:.4px">'+label+'</td><td style="border-bottom:1px solid #e6dfd2"></td>';MO.forEach(function(m){h+='<td style="text-align:right;padding:6px 9px;font-size:10px;font-weight:700;color:#a89d8d;text-transform:uppercase">'+m+'</td>';});h+='<td style="text-align:right;padding:6px 9px;font-size:10px;font-weight:700;color:#6b6357;text-transform:uppercase">Total</td></tr>';return h;};
    var rowLabel=function(txt,bold){return '<td style="padding:6px 10px 6px 22px;font-size:11.5px;color:#3a352e;font-weight:'+(bold?"700":"500")+';white-space:nowrap;border-bottom:1px solid #f4f0e8">'+txt+'</td>';};
    var lead=function(){return '<td style="border-bottom:1px solid #f4f0e8"></td>';};

    var h='<div class="cd"><div class="ch"><div class="ct2">📊 P&amp;L mensal '+(typeof activeYear==="function"?activeYear():"2026")+'</div><div style="font-size:11px;color:#a89d8d">Proveitos − Custos = Saldo, mês a mês</div></div>';
    h+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:920px">';
    // PROVEITOS
    h+=monthHdr("Proveitos");
    h+='<tr>'+lead()+rowLabel("Faturação",false);for(var m=0;m<12;m++)h+=cell(fatM[m]);h+=cell(sum(fatM),{bold:true})+'</tr>';
    h+='<tr style="background:#faf8f4">'+lead()+rowLabel("Total",true);for(var m=0;m<12;m++)h+=cell(fatM[m],{bold:true});h+=cell(sum(fatM),{bold:true,color:GRN})+'</tr>';
    // CUSTOS
    h+=monthHdr("Custos");
    tkeys.forEach(function(k){h+='<tr>'+lead()+rowLabel(LBL[k]||k,false);for(var m=0;m<12;m++)h+=cell(-types[k][m],{color:types[k][m]?R:"#3a352e"});h+=cell(-sum(types[k]),{color:R})+'</tr>';});
    h+='<tr style="background:#faf8f4">'+lead()+rowLabel("Total",true);for(var m=0;m<12;m++)h+=cell(-costM[m],{bold:true,color:costM[m]?R:"#3a352e"});h+=cell(-sum(costM),{bold:true,color:R})+'</tr>';
    // SALDO
    h+=monthHdr("Saldo");
    h+='<tr style="background:#fbfaf7">'+lead()+rowLabel("Saldo",true);for(var m=0;m<12;m++)h+=cell(saldoM[m],{bold:true,color:saldoM[m]<0?R:(saldoM[m]>0?GRN:"#3a352e")});var st=sum(saldoM);h+=cell(st,{bold:true,color:st<0?R:GRN})+'</tr>';
    h+='</table></div></div>';
    return h;
  }
  function injectPLmonthly(){
    var app=document.getElementById("app");if(!app||app.querySelector(".pnlMonthlyWrap"))return;
    var wrap=document.createElement("div");wrap.className="pnlMonthlyWrap";wrap.innerHTML=buildPLtable();
    var g2=app.querySelector(".g2");
    if(g2)app.insertBefore(wrap,g2);else app.appendChild(wrap);
  }

  // Encaminha o render da secção "followup" para a nossa função; no P&L injeta a tabela mensal no topo
  var _rPnl=rPnl;
  rPnl=function(){
    if(typeof cTab!=="undefined"&&cTab==="followup"){return renderFollowup();}
    var r=_rPnl.apply(this,arguments);
    if(typeof cTab!=="undefined"&&cTab==="pl"){try{injectPLmonthly();}catch(e){}}
    return r;
  };

  // Atualiza o menu já desenhado
  if(typeof rTabs==="function")rTabs();
})();
</script>

  // anular um movimento — repõe o estado imediatamente antes desse movimento
  window.mwRevert=function(logId){
    if(currentRole!=="admin"){toastSafe("Só o administrador pode anular movimentos.");return;}
    var entry=(D._log||[]).filter(function(x){return x.id===logId;})[0];
    if(!entry||!entry.before){toastSafe("Este movimento não tem cópia guardada para anular.");return;}
    var doIt=function(){
      var keep=(D._log||[]).slice();
      var redo=(D._redo||[]).slice();
      var afterSnap=snapClone(); // estado atual (o que vamos anular) — para poder refazer
      var restored=JSON.parse(JSON.stringify(entry.before));
      restored.attachments=D.attachments||[];
      restored._log=keep;restored._redo=redo;
      D=restored;
      D._redo.unshift({ts:new Date().toISOString(),desc:entry.desc,after:afterSnap});
      if(D._redo.length>15)D._redo=D._redo.slice(0,15);
      __suppressRedoClear=true;
      if(typeof logAct==="function")logAct("Anulação",'Movimento anulado: "'+entry.desc+'"');

      if(typeof save==="function")save();

  // ===================== LEMBRETES DE FOLLOW-UP (sino no cabeçalho) =====================
  function computeReminders(){
    var today=new Date().toISOString().slice(0,10);
    var in7=new Date(Date.now()+7*86400000).toISOString().slice(0,10);
    var res={overdue:[],today:[],upcoming:[]};
    (D.deals||[]).forEach(function(d){
      if(!d.nextDate)return;
      if(typeof isClosed==="function"&&isClosed(d))return;
      if(d.nextDate<today)res.overdue.push(d);
      else if(d.nextDate===today)res.today.push(d);
      else if(d.nextDate<=in7)res.upcoming.push(d);
    });
    var s=function(a,b){return (a.nextDate||"").localeCompare(b.nextDate||"");};
    res.overdue.sort(s);res.today.sort(s);res.upcoming.sort(s);
    return res;
  }

  var PH_ALL=[
    {k:"arranque",l:"Arranque",gate:false},
    {k:"levantamento",l:"Levantamento",gate:false},
    {k:"instalacao",l:"Instalação & Config.",gate:false},
    {k:"integracao",l:"Integração",gate:true},
    {k:"testes",l:"Testes & Validação",gate:true},
    {k:"formacao",l:"Formação",gate:false},
    {k:"golive",l:"Go-live",gate:true},
    {k:"fecho",l:"Fecho & Aceitação",gate:true}
  ];
  var PH_LBL={};PH_ALL.forEach(function(p){PH_LBL[p.k]=p;});
  var PROJ_TPL={
    rapido:{l:"Rápido (instalação)",phases:["arranque","instalacao","formacao","fecho"]},
    implementacao:{l:"Implementação",phases:["arranque","levantamento","instalacao","formacao","golive","fecho"]},
    integracao:{l:"Integração (completo)",phases:["arranque","levantamento","instalacao","integracao","testes","formacao","golive","fecho"]}
  };
  var PROJ_TIPO=[["implementacao","Implementação"],["integracao","Integração"],["misto","Misto"]];
  function tipoLbl(v){var m=PROJ_TIPO.filter(function(x){return x[0]===v;})[0];return m?m[1]:v;}
  function todayISO(){return new Date().toISOString().slice(0,10);}
  function addDays(iso,n){var d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
  var projView=null; // null = portfólio; id = workspace de um projeto

  function buildPhases(tpl){
    var t=PROJ_TPL[tpl]||PROJ_TPL.implementacao;
    return t.phases.map(function(k,i){var p=PH_LBL[k]||{k:k,l:k,gate:false};return {id:uid(),k:k,l:p.l,gate:p.gate,estado:i===0?"em_curso":"por_iniciar",dataPrev:"",dataReal:""};});
  }
  function setCurrentByKey(r,key){
    var idx=r.fases.map(function(f){return f.k;}).indexOf(key);
    if(idx<0)idx=0;
    r.fases.forEach(function(f,i){f.estado=i<idx?"concluida":(i===idx?"em_curso":"por_iniciar");if(i<idx&&!f.dataReal)f.dataReal="";});
  }
  // garante o modelo novo (migra os projetos antigos sem perder dados)
  function ensureProj(r){
    if(!r)return r;
    if(!Array.isArray(r.fases)||!r.fases.length){
      var tpl=r.template||(r.tipo==="integracao"?"integracao":"implementacao");
      r.template=tpl;r.fases=buildPhases(tpl);
      var mapKey={a_iniciar:"arranque",em_curso:"instalacao",testes:"testes",concluido:"__all__"}[r.status||"a_iniciar"];
      if(mapKey==="__all__")r.fases.forEach(function(f){f.estado="concluida";});
      else if(mapKey)setCurrentByKey(r,mapKey);
    }
    if(r.template==null)r.template=r.tipo==="integracao"?"integracao":"implementacao";
    if(r.nome==null)r.nome="";
    if(r.gestor==null)r.gestor="";
    if(r.inicio==null)r.inicio=r.createdAt||todayISO();
    if(r.fimPrev==null)r.fimPrev="";
    return r;
  }
  function projRec(dealId){
    if(!Array.isArray(D.projectos))D.projectos=[];
    var r=D.projectos.filter(function(p){return p.dealId===dealId;})[0];
    if(!r){var dl=(D.deals||[]).filter(function(d){return d.id===dealId;})[0]||{};var isInt=/integ|HIS|EMR|PACS|Diraya/i.test(dl.product||"");r={id:uid(),dealId:dealId,tipo:isInt?"integracao":"implementacao",status:"a_iniciar",note:"",createdAt:todayISO()};D.projectos.push(r);}
    return ensureProj(r);
  }
  function projName(r,d){return (r&&r.nome)||(d&&d.product)||"Projeto";}
  function projProgress(r){var t=r.fases.length||1;var c=r.fases.filter(function(f){return f.estado==="concluida";}).length;return Math.round(c/t*100);}
  function projCurrent(r){var em=r.fases.filter(function(f){return f.estado==="em_curso";})[0];if(em)return em;var pi=r.fases.filter(function(f){return f.estado!=="concluida";})[0];return pi||r.fases[r.fases.length-1];}
  function projDone(r){return r.fases.length&&r.fases.every(function(f){return f.estado==="concluida";});}
  function projHealth(r){
    if(projDone(r))return {k:"concluido",l:"Concluído",c:SL};
    var today=todayISO(),d7=addDays(today,7);
    var late=r.fases.some(function(f){return f.estado!=="concluida"&&f.dataPrev&&f.dataPrev<today;})||(r.fimPrev&&r.fimPrev<today);
    if(late)return {k:"risco",l:"Em risco",c:R};
    var soon=r.fases.some(function(f){return f.estado!=="concluida"&&f.dataPrev&&f.dataPrev>=today&&f.dataPrev<=d7;})||(r.fimPrev&&r.fimPrev>=today&&r.fimPrev<=d7);
    if(soon)return {k:"atencao",l:"Atenção",c:GD};
    return {k:"ok",l:"No prazo",c:GRN};
  }

  window.doAttach=async function(dealId,kind){
    if(!attWritable()){toastSafe("Sem permissão para anexar aqui.");return;}
    if(!sb){toastSafe("Sem ligação ao servidor.");return;}
    var el=document.getElementById("attFile");var f=el&&el.files&&el.files[0];if(!f)return;
    if(f.size>ATT_MAX2){toastSafe("O ficheiro tem "+(typeof fmtKB==="function"?fmtKB(f.size):"")+", acima do limite de 20 MB.");return;}
    var prog=document.getElementById("attProg");if(prog)prog.textContent="A enviar “"+f.name+"”…";
    var path="deals/"+dealId+"/"+uid()+"-"+f.name.replace(/[^\w.\-]+/g,"_");
    var up=await sb.storage.from(ATT_BUCKET).upload(path,f,{contentType:f.type||undefined,upsert:false});
    if(up.error){toastSafe("Erro a enviar: "+up.error.message);if(prog)prog.textContent="";return;}
    if(!D.attachments)D.attachments=[];
    var att={id:uid(),dealId:dealId,name:f.name,type:f.type||"",size:f.size,path:path,kind:kind,at:new Date().toISOString().slice(0,10)};
    D.attachments.push(att);
    if(save()){if(typeof logAct==="function")logAct("Anexo","Anexado ("+kind+"): "+f.name+" — "+cn((D.deals.find(function(d){return d.id===dealId;})||{}).clientId));openAttM(dealId,kind);}
    else{try{await sb.storage.from(ATT_BUCKET).remove([path]);}catch(e){}D.attachments=D.attachments.filter(function(a){return a.id!==att.id;});}
  };

    if(!sb||!a.path){toastSafe("Anexo indisponível.");return;}
    var s=await sb.storage.from(ATT_BUCKET).createSignedUrl(a.path,600);

  var ALWAYS_TABS={};DEPT_GROUPS.forEach(function(g){if(g.always)g.items.forEach(function(it){ALWAYS_TABS[it.id]=true;});});
  function deptOf(id){return TAB2DEPT[id]||null;}
  function groupDept(gname){for(var i=0;i<DEPT_GROUPS.length;i++)if(DEPT_GROUPS[i].group===gname)return DEPT_GROUPS[i].dept;return null;}
  var DEFAULT_LEVEL={editor:{operacoes:"read",comercial:"edit",projectos:"read"},comercial:{comercial:"read"},viewer:{operacoes:"read",comercial:"read",projectos:"read"}};
  function userDepts(){
    if(currentRole==="admin")return {direcao:"edit",operacoes:"edit",comercial:"edit",projectos:"edit",suporte:"edit"};
    if(currentDepts&&typeof currentDepts==="object"&&Object.keys(currentDepts).length)return currentDepts;
    return DEFAULT_LEVEL[currentRole]||{};
  }
  function canSeeTab(id){
    if(currentRole==="admin")return true;
    if(ALWAYS_TABS[id])return true;
    var d=deptOf(id);if(!d||d==="admin")return false;
    return !!userDepts()[d];
  }
  function firstAllowedTab(){
    if(currentRole==="admin")return "dashboard";
    var ud=userDepts();
    for(var i=0;i<DEPT_GROUPS.length;i++){var g=DEPT_GROUPS[i];if(g.dept!=="admin"&&!g.always&&ud[g.dept])return g.items[0].id;}
    return "ferias";
  }
  // reconstrói o menu por departamentos (substitui o NAV antigo)
  if(typeof NAV!=="undefined"){NAV.length=0;DEPT_GROUPS.forEach(function(g){NAV.push({group:g.group,i:g.i,always:g.always,items:g.items});});}
  if(typeof TABS!=="undefined"){["followup","logs","colaboradores","projetos","suporte","ferias","rh"].forEach(function(id){if(!TABS.some(function(t){return t.id===id;}))TABS.push({id:id});});}

  // menu: admin vê tudo; membro vê os seus departamentos + os grupos de acesso geral (Férias)
  if(typeof rTabs==="function"){
    var _rTabsD=rTabs;
    rTabs=function(){
      if(currentRole==="admin")return _rTabsD();
      var ud=userDepts(),saved=NAV;
      NAV=saved.filter(function(n){if(n.always)return true;var d=groupDept(n.group);return d&&d!=="admin"&&ud[d];});
      try{_rTabsD();}finally{NAV=saved;}
    };
  }
  if(typeof sTab==="function"){
    var _sTabD=sTab;
    window.sTab=function(id,sub){if(!canSeeTab(id))return;return _sTabD(id,sub);};
  }

  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();
</script>
